S.guestbook={title:'Guestbook',label:'Guestbook',status:'Sign the book',wire:root=>wireGuestbook(root),html:()=>
  post('Leave a note',BY+'guestbook',`<div class="form"><label>Name<input class="inp" data-gb="name" maxlength="60" autocomplete="name" placeholder="Your name"></label><label>Message<textarea class="inp" data-gb="msg" rows="4" maxlength="2000" placeholder="Say hi, leave feedback, share a link…"></textarea></label><div class="rowbtns"><button type="button" class="btn gb-post">Post on GitHub</button><a class="btn gb-mail" href="#">Send by email</a></div><p class="note">Posting opens a pre-filled note on this site’s GitHub repository, so it lands right next to the code (you need a GitHub account; a new tab opens). Email works without one.</p></div>`)
 +`<div class="gb-head"><b>Notes from visitors</b><button type="button" class="btn gb-refresh">Refresh</button></div><div class="gb-list"><p class="note">Loading notes…</p></div>`};
function gbEntry(i){const name=String(i.title||'').replace(/^guestbook\s*[:\-–—]?\s*/i,'').trim()||(i.user&&i.user.login)||'Someone';
 let body=String(i.body||'').replace(/\r/g,'').replace(/\n+—\nPosted from[^\n]*$/,'').trim();if(body.length>700)body=body.slice(0,700)+'…';
 const when=i.created_at?new Date(i.created_at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
 return post(name,`By ${i.user&&i.user.login?i.user.login:'guest'} • ${when}`,`<p>${esc(body).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')}</p><p class="note"><a href="${esc(i.html_url||gbListUrl())}" target="_blank" rel="noopener">Reply on GitHub</a></p>`);}
async function loadGuestbook(root,force){const box=root.querySelector('.gb-list');if(!box)return;
 if(GB.cache&&!force){box.innerHTML=GB.cache;return;}
 box.innerHTML='<p class="note">Loading notes…</p>';
 try{const r=await fetch(`https://api.github.com/repos/${D.guestbook.repo}/issues?state=open&per_page=30&sort=created`,{headers:{Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const items=(await r.json()).filter(i=>!i.pull_request&&(/^guestbook/i.test(i.title||'')||(i.labels||[]).some(l=>l&&l.name===D.guestbook.label)));
  GB.cache=items.length?items.map(gbEntry).join(''):'<p class="note">No notes yet — be the first to sign.</p>';box.innerHTML=GB.cache;}
 catch(e){GB.cache=null;box.innerHTML=`<p class="note">Could not load the notes right now. <a href="${esc(gbListUrl())}" target="_blank" rel="noopener">Read them on GitHub</a>.</p>`;}}
function wireGuestbook(root){if(!root)return;const name=root.querySelector('[data-gb=name]'),msg=root.querySelector('[data-gb=msg]');if(!name||!msg)return;
 name.value=GB.draft.name||'';msg.value=GB.draft.msg||'';
 const save=()=>{GB.draft={name:name.value,msg:msg.value};try{localStorage.setItem('rifff-gb',JSON.stringify(GB.draft));}catch(e){}
  document.querySelectorAll('[data-gb=name]').forEach(el=>{if(el!==name)el.value=name.value;});document.querySelectorAll('[data-gb=msg]').forEach(el=>{if(el!==msg)el.value=msg.value;});};
 name.addEventListener('input',save);msg.addEventListener('input',save);
 const text=()=>({n:name.value.trim()||'Anonymous',m:msg.value.trim()});
 root.querySelector('.gb-post').addEventListener('click',()=>{const t=text();if(!t.m){msg.focus();return;}
  const q=new URLSearchParams({title:'Guestbook: '+t.n,body:t.m+'\n\n—\nPosted from the castle guestbook',labels:D.guestbook.label});
  window.open(`https://github.com/${D.guestbook.repo}/issues/new?${q}`,'_blank','noopener');});
 root.querySelector('.gb-mail').addEventListener('click',e=>{const t=text();if(!t.m){e.preventDefault();msg.focus();return;}
  e.currentTarget.href=`mailto:${D.emails[0]}?subject=${encodeURIComponent('Guestbook: '+t.n)}&body=${encodeURIComponent(t.m)}`;});
 root.querySelector('.gb-refresh').addEventListener('click',()=>loadGuestbook(root,true));
 loadGuestbook(root,false);}

/* ---- canvas textures ---- */
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function mkRand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function rgb(c,n=0){const k=v=>Math.max(0,Math.min(255,Math.round(v+n)));return `rgb(${k(c[0])},${k(c[1])},${k(c[2])})`;}
function grain(x,w,h,base,amt,r,step){for(let y=0;y<h;y+=step)for(let i=0;i<w;i+=step){x.fillStyle=rgb(base,(r()-0.5)*amt);x.fillRect(i,y,step,step);}}
function brickCanvas(base,seed){const w=128,h=128,c=cnv(w,h),x=c.getContext('2d'),r=mkRand(seed);
 x.fillStyle=rgb([base[0]*0.55,base[1]*0.55,base[2]*0.55]);x.fillRect(0,0,w,h);const bh=16,bw=32;
 for(let row=0;row<h/bh;row++){const off=(row%2)*bw/2;for(let i=-1;i<w/bw+1;i++){const bx=i*bw+off,tint=(r()-0.5)*30;x.fillStyle=rgb(base,tint);x.fillRect(bx+1,row*bh+1,bw-2,bh-2);
  for(let k=0;k<14;k++){x.fillStyle=rgb(base,tint+(r()-0.5)*44);x.fillRect(bx+2+Math.floor(r()*(bw-4)),row*bh+2+Math.floor(r()*(bh-4)),2,2);}
  x.fillStyle=rgb(base,tint+22);x.fillRect(bx+1,row*bh+1,bw-2,1);}}
 return c;}
function tileCanvas(base,seed){const w=64,h=64,c=cnv(w,h),x=c.getContext('2d'),r=mkRand(seed);
 x.fillStyle=rgb([base[0]*0.5,base[1]*0.5,base[2]*0.5]);x.fillRect(0,0,w,h);
 for(let ty=0;ty<2;ty++)for(let tx=0;tx<2;tx++){const tint=(r()-0.5)*24;x.fillStyle=rgb(base,tint);x.fillRect(tx*32+1,ty*32+1,30,30);
  for(let k=0;k<40;k++){x.fillStyle=rgb(base,tint+(r()-0.5)*30);x.fillRect(tx*32+1+Math.floor(r()*30),ty*32+1+Math.floor(r()*30),2,2);}
  x.fillStyle=rgb(base,tint+18);x.fillRect(tx*32+1,ty*32+1,30,1);x.fillRect(tx*32+1,ty*32+1,1,30);}
 return c;}
function noiseCanvas(base,amt,seed){const c=cnv(32,32),x=c.getContext('2d');grain(x,32,32,base,amt,mkRand(seed),2);return c;}
function roofCanvas(seed){const w=64,h=64,c=cnv(w,h),x=c.getContext('2d'),r=mkRand(seed),base=[168,54,46];
 x.fillStyle=rgb(base,-45);x.fillRect(0,0,w,h);
 for(let row=0;row<8;row++){const off=(row%2)*8;for(let i=-1;i<9;i++){x.fillStyle=rgb(base,(r()-0.5)*36);x.fillRect(i*16+off+1,row*8+1,14,6);}}
 return c;}
function woodCanvas(seed){const w=64,h=64,c=cnv(w,h),x=c.getContext('2d'),r=mkRand(seed),base=[118,80,46];
 x.fillStyle=rgb(base);x.fillRect(0,0,w,h);
 for(let i=0;i<w;i+=2){x.fillStyle=rgb(base,(r()-0.5)*40);x.fillRect(i,0,2,h);}
 for(let p=0;p<4;p++){x.fillStyle=rgb(base,-50);x.fillRect(0,p*16,w,1);}
 return c;}
function boardCanvas(title,sub){const w=256,h=128,c=cnv(w,h),x=c.getContext('2d');
 x.fillStyle='#d9d2b8';x.fillRect(0,0,w,h);x.fillStyle='#fbf6e6';x.fillRect(5,5,w-10,h-10);
 x.fillStyle='#b9b196';x.fillRect(5,h-7,w-10,2);x.fillRect(w-7,5,2,h-10);
 x.fillStyle='#c23b3b';[[11,11],[w-16,11],[11,h-16],[w-16,h-16]].forEach(p=>x.fillRect(p[0],p[1],5,5));
 x.textAlign='center';x.textBaseline='middle';x.fillStyle='#1d221c';
 const fs=26;x.font=`700 ${fs}px "Pixelify Sans", monospace`;
 const lines=[];let cur='';title.split(' ').forEach(wd=>{const t=cur?cur+' '+wd:wd;if(x.measureText(t).width>w-40&&cur){lines.push(cur);cur=wd;}else cur=t;});if(cur)lines.push(cur);
 const lh=fs+2;let y=h/2-8-(lines.length-1)*lh/2;lines.forEach(l=>{x.fillText(l,w/2,y);y+=lh;});
 x.font='400 13px "Pixelify Sans", monospace';x.fillStyle='#6b6f66';x.fillText(sub,w/2,h-21);
 return c;}
function texFrom(c){const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=ANISO;return t;}
function mat(c,rx,ry,color){const t=texFrom(c);t.repeat.set(rx,ry);return new THREE.MeshLambertMaterial({map:t,color:color===undefined?0xffffff:color});}
function faceMat(title,sub){const t=texFrom(boardCanvas(title,sub));t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return new THREE.MeshLambertMaterial({map:t});}
function labelSprite(text,scale){scale=scale||1;const c=cnv(256,64),x=c.getContext('2d');let fs=34;x.font=`700 ${fs}px "Pixelify Sans", monospace`;
 while(x.measureText(text).width>236&&fs>14){fs-=2;x.font=`700 ${fs}px "Pixelify Sans", monospace`;}
 x.textAlign='center';x.textBaseline='middle';x.lineWidth=5;x.lineJoin='round';x.strokeStyle='#0e0f14';x.strokeText(text,128,33);x.fillStyle='#fff';x.fillText(text,128,33);
 const t=texFrom(c);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(3.2*scale,0.8*scale,1);return s;}
function makeCanvases(){C.tile=tileCanvas([98,106,96],3);C.tileCool=tileCanvas([104,108,118],5);C.hedge=noiseCanvas([52,92,40],26,9);C.roof=roofCanvas(11);C.wood=woodCanvas(13);C.dark=noiseCanvas([44,46,50],10,17);C.brick={};}
function brickFor(tint){const k=tint.join(',');if(!C.brick[k])C.brick[k]=brickCanvas(tint,7);return C.brick[k];}

function box(w,h,d,m,x,y,z,ry){const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);g.position.set(x,y,z);if(ry)g.rotation.y=ry;world.add(g);return g;}
function wallPos(side,along){const w=G.bounds.w,d=G.bounds.d,hw=w/2,hd=d/2;
 if(side==='N')return{x:along,z:-hd,rot:0,nx:0,nz:1};if(side==='S')return{x:along,z:hd,rot:Math.PI,nx:0,nz:-1};
 if(side==='E')return{x:hw,z:along,rot:-Math.PI/2,nx:-1,nz:0};return{x:-hw,z:along,rot:Math.PI/2,nx:1,nz:0};}
function wallPoint(side,t){const L=(side==='N'||side==='S')?G.bounds.w:G.bounds.d;return wallPos(side,t*(L/2-2.5));}
function wallSeg(side,a,b,c){const w=G.bounds.w,d=G.bounds.d,H=G.bounds.H,len=b-a,mid=(a+b)/2;if(len<=0)return;const m=mat(c,len/2.5,H/2.5);
 if(side==='N')box(len,H,1,m,mid,H/2,-d/2-0.5);else if(side==='S')box(len,H,1,m,mid,H/2,d/2+0.5);
 else if(side==='E')box(1,H,len,m,w/2+0.5,H/2,mid);else box(1,H,len,m,-w/2-0.5,H/2,mid);}
const DW=3,DH=3.4;

 const lh=H-DH,m=mat(c,DW/2.5,lh/2.5);
 if(side==='N')box(DW,lh,1,m,doorAt,DH+lh/2,-d/2-0.5);else if(side==='S')box(DW,lh,1,m,doorAt,DH+lh/2,d/2+0.5);
 else if(side==='E')box(1,lh,DW,m,w/2+0.5,DH+lh/2,doorAt);else box(1,lh,DW,m,-w/2-0.5,DH+lh/2,doorAt);}

/* ---- room lifecycle ---- */
function clearWorld(){const kill=[];world.traverse(o=>{if(o!==world)kill.push(o);});
 kill.forEach(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}});
 while(world.children.length)world.remove(world.children[0]);}
function buildRoom(key){clearWorld();const R=ROOMS[key];G.roomKey=key;G.bounds={w:R.w,d:R.d,H:R.H,indoor:R.indoor};
 G.inter=[];G.colliders=[];G.doors=[];G.torches=[];G.near=null;
 const w=R.w,d=R.d,H=R.H,bc=brickFor(R.tint);
 const fc=R.floor==='wood'?C.wood:(R.indoor?C.tileCool:C.tile),fr=R.floor==='wood'?3:4;
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(w+2,d+2),mat(fc,(w+2)/fr,(d+2)/fr));fl.rotation.x=-Math.PI/2;world.add(fl);
 if(R.indoor){const ce=new THREE.Mesh(new THREE.PlaneGeometry(w+2,d+2),mat(C.dark,(w+2)/4,(d+2)/4));ce.rotation.x=Math.PI/2;ce.position.y=H;world.add(ce);}
 const doors=R.doors||[{side:'S',at:0,to:'lobby',label:'Back to lobby'}];
 ['N','E','S','W'].forEach(side=>{const dr=doors.find(x=>x.side===side);wall(side,dr?dr.at:null,bc);});
 doors.forEach(makeDoor);
 (R.boards||[]).forEach(makeBoard);
 (R.torches||[]).forEach(t=>makeTorch(t[0],t[1]));
 DN.amb=new THREE.AmbientLight(0xffffff,1);world.add(DN.amb);
 DN.hemi=new THREE.HemisphereLight(0xffffff,0x000000,1);world.add(DN.hemi);
 DN.dir=null;if(!R.indoor){DN.dir=new THREE.DirectionalLight(0xffffff,0.5);DN.dir.position.set(30,60,-20);world.add(DN.dir);}
 scene.fog=new THREE.Fog(0x0d0b1c,R.indoor?14:24,R.indoor?46:95);
 if(key==='lobby')lobbyExtras(R);
 DN.dirty=true;applyDN();}
function placePlayer(key,prev,viaDoor){const p=player;G.camYaw=0;
 if(key==='lobby'){const dr=prev&&ROOMS.lobby.doors.find(x=>x.to===prev);
  if(dr&&viaDoor){const q=wallPos(dr.side,dr.at);p.x=q.x+q.nx*2.8;p.z=q.z+q.nz*2.8;p.heading=Math.atan2(q.nx,q.nz);}
  else{p.x=0;p.z=5;p.heading=Math.PI;}}
 else{p.x=0;p.z=ROOMS[key].d/2-5.0;p.heading=Math.PI;}
 p.group.position.set(p.x,0,p.z);p.group.rotation.y=p.heading;}
function enterRoom(key,viaDoor,instant){if(G.transition||!ROOMS[key])return;G.transition=true;closeWindow();closeMenu();
 const doIt=()=>{const prev=G.roomKey;buildRoom(key);placePlayer(key,prev,viaDoor);G.cooldown=1.2;updateHUD();updateCamera(1);G.transition=false;if(key==='music')jukeEnter();else jukeLeave();};
 if(instant){doIt();return;}
 const f=$('#fade');f.classList.add('on');setTimeout(()=>{doIt();requestAnimationFrame(()=>f.classList.remove('on'));},360);}
function goRoom(k){if(k===G.roomKey||G.transition)return;enterRoom(k,null,false);}

 night:{bg:0x0d0b1c,fog:0x0d0b1c,fogN:24,fogF:95,amb:0x33334f,ambI:1.0,hsky:0x4a4a86,hgnd:0x1b1a14,hI:0.75,dir:0x9fb0ff,dirI:0.55,dx:30,dy:60,dz:-20,iamb:0x6a5a48,iambI:0.9,ihI:0.35},
 day:{bg:0x8dbfea,fog:0xb9d6ee,fogN:34,fogF:170,amb:0xcdd8e6,ambI:0.55,hsky:0xe4efff,hgnd:0x7a7452,hI:0.55,dir:0xfff0cc,dirI:0.85,dx:-40,dy:70,dz:-30,iamb:0x8d7d69,iambI:1.0,ihI:0.5}};

function setDay(v,instant){DN.target=v?1:0;if(instant)DN.t=DN.target;DN.dirty=true;try{localStorage.setItem('rifff-day',v?'1':'0');}catch(e){}
 const b=$('#dayBtn');if(b){b.textContent=v?'\u2600 Day':'\u263e Night';b.setAttribute('aria-pressed',v?'true':'false');}}
function applyDN(){const R=ROOMS[G.roomKey];if(!R||!DN.sky||!DN.amb)return;const t=DN.t,n=DN.night,d=DN.day;DN.c2=DN.c2||new THREE.Color();
 const L=(a,b)=>a+(b-a)*t,col=(o,a,b)=>o.setHex(a).lerp(DN.c2.setHex(b),t);
 col(scene.background,n.bg,d.bg);
 if(R.indoor){scene.fog.color.setHex(0x0d0b1c);col(DN.amb.color,n.iamb,d.iamb);DN.amb.intensity=L(n.iambI,d.iambI);col(DN.hemi.color,n.hsky,d.hsky);col(DN.hemi.groundColor,n.hgnd,d.hgnd);DN.hemi.intensity=L(n.ihI,d.ihI);}
 else{col(scene.fog.color,n.fog,d.fog);scene.fog.near=L(n.fogN,d.fogN);scene.fog.far=L(n.fogF,d.fogF);
  col(DN.amb.color,n.amb,d.amb);DN.amb.intensity=L(n.ambI,d.ambI);col(DN.hemi.color,n.hsky,d.hsky);col(DN.hemi.groundColor,n.hgnd,d.hgnd);DN.hemi.intensity=L(n.hI,d.hI);
  if(DN.dir){col(DN.dir.color,n.dir,d.dir);DN.dir.intensity=L(n.dirI,d.dirI);DN.dir.position.set(L(n.dx,d.dx),L(n.dy,d.dy),L(n.dz,d.dz));}}
 DN.sky.visible=!R.indoor;DN.stars.material.opacity=1-t;DN.stars.visible=t<0.999;DN.moon.material.opacity=1-t;DN.moon.visible=t<0.999;
 DN.sun.material.opacity=t;DN.sun.visible=t>0.001;DN.cloudMat.opacity=t*0.96;DN.clouds.forEach(c=>{c.visible=t>0.001;});}
function tickDN(dt){if(Math.abs(DN.t-DN.target)>0.0005||DN.dirty){DN.t+=(DN.target-DN.t)*Math.min(1,dt*1.6);if(Math.abs(DN.t-DN.target)<0.0005)DN.t=DN.target;DN.dirty=false;applyDN();}
 if(DN.t>0.001&&DN.sky.visible)DN.clouds.forEach(c=>{c.position.x+=dt*c.userData.speed;if(c.position.x>150)c.position.x=-150;});}

/* ---- jukebox: SoundCloud widget that plays while you are in the music room ---- */
const J={w:null,idx:0,loadedIdx:-1,playing:false,ready:false,loading:null,userPaused:false,want:false,failed:false};
const trackUrl=i=>'https://api.soundcloud.com/tracks/'+D.compose[i].id;
const WOPT='&show_artwork=false&visual=false&buying=false&sharing=false&download=false&show_playcount=false&show_user=false&hide_related=true';
function jukeLoadApi(){if(window.SC&&SC.Widget)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://w.soundcloud.com/player/api.js';s.async=true;s.onload=()=>window.SC&&SC.Widget?res():rej(new Error('SC missing'));s.onerror=()=>rej(new Error('SC script failed'));document.head.appendChild(s);});}
function jukeUI(status){const c=D.compose[J.idx];$('#jukeTitle').textContent=c.title;$('#jukeLink').href=c.url;$('#jukePlay').textContent=J.playing?'\u275a\u275a':'\u25b6';
 $('#jukeStatus').textContent=status||(J.failed?'Player unavailable':J.playing?'Playing':J.ready?'Paused':'Loading\u2026');}
function jukeInit(){if(J.loading)return J.loading;
 J.loading=jukeLoadApi().then(()=>new Promise((res,rej)=>{const f=document.createElement('iframe');f.id='scFrame';f.title='SoundCloud player';f.setAttribute('allow','autoplay');
  f.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(trackUrl(J.idx))+'&auto_play=false'+WOPT;J.loadedIdx=J.idx;$('#juke').appendChild(f);
  const w=J.w=SC.Widget(f),E=SC.Widget.Events,timer=setTimeout(()=>rej(new Error('widget timeout')),15000);
  w.bind(E.READY,()=>{clearTimeout(timer);J.ready=true;w.setVolume(80);jukeUI();res();});
  w.bind(E.PLAY,()=>{J.playing=true;jukeUI();});w.bind(E.PAUSE,()=>{J.playing=false;jukeUI();});
  w.bind(E.FINISH,()=>{J.playing=false;if(J.want)jukePlay(J.idx+1);});
  w.bind(E.ERROR,()=>{jukeUI('Track could not be loaded');});}));
 J.loading.catch(()=>{J.failed=true;J.loading=null;jukeUI();});return J.loading;}
function jukePlay(i){const n=D.compose.length;if(i!==undefined)J.idx=((i%n)+n)%n;J.userPaused=false;J.want=true;if(J.failed){jukeUI();return;}jukeUI();
 jukeInit().then(()=>{if(!J.want)return;
  if(J.loadedIdx!==J.idx){J.loadedIdx=J.idx;J.w.load(trackUrl(J.idx),{auto_play:true,show_artwork:false,visual:false,buying:false,sharing:false,download:false,show_playcount:false,show_user:false,hide_related:true,callback:()=>{J.w.setVolume(80);}});}
  else J.w.play();
  setTimeout(()=>{if(J.want&&!J.playing&&!J.failed)jukeUI((TOUCH?'Tap':'Click')+' \u25b6 to play');},3000);}).catch(()=>{});}
function jukePause(byUser){J.want=false;if(byUser)J.userPaused=true;if(J.w&&J.ready&&J.playing)J.w.pause();}
function jukeEnter(){$('#juke').hidden=false;jukeUI();if(!J.userPaused)jukePlay();}
function jukeLeave(){$('#juke').hidden=true;jukePause(false);}
function jukeToggle(){if(J.playing)jukePause(true);else jukePlay();}
function bindJuke(){$('#jukePlay').addEventListener('click',jukeToggle);$('#jukePrev').addEventListener('click',()=>jukePlay(J.idx-1));$('#jukeNext').addEventListener('click',()=>jukePlay(J.idx+1));
 $('#dayBtn').addEventListener('click',()=>setDay(DN.target<0.5,false));}

/* ---- HUD ---- */
const svg=r=>`<svg viewBox="0 0 16 16" aria-hidden="true">${r.map(q=>`<rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[3]}"${q[4]?` fill="${q[4]}"`:''}/>`).join('')}</svg>`;
const ICON={
 castle:svg([[2,7,12,7],[2,4,2,3],[7,4,2,3],[12,4,2,3],[6,10,4,4,'#c9cec7']]),
 person:svg([[6,2,4,4],[4,7,8,6],[5,13,2,2],[9,13,2,2]]),
 folder:svg([[2,3,5,2],[2,5,12,9],[4,8,8,4,'#c9cec7']]),
 scroll:svg([[4,2,8,12],[6,5,4,1,'#c9cec7'],[6,7,4,1,'#c9cec7'],[6,9,4,1,'#c9cec7']]),
 note:svg([[9,2,2,9],[9,2,5,2],[12,4,2,3],[5,10,6,4]]),
 help:svg([[5,2,6,2],[10,4,2,3],[7,7,4,2],[7,9,2,2],[7,13,2,2]])};
function buildBar(){const BAR=[['lobby','Lobby',ICON.castle],['profile','Profile',ICON.person],['portfolio','Portfolio',ICON.folder],['resume','Resume',ICON.scroll],['music','Music',ICON.note],['help','Help',ICON.help]];
 $('#bar .btns').innerHTML=BAR.map(b=>`<button type="button" data-go="${b[0]}">${b[2]}<span>${b[1]}</span></button>`).join('');
 $('#bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.go;if(k==='help'){if(G.winOpen)closeWindow();else openWindow('welcome');}else goRoom(k);});}
function buildMenu(){const m=$('#locMenu');m.innerHTML=Object.keys(ROOMS).map(k=>`<button type="button" data-room="${k}">${esc(ROOMS[k].name)}</button>`).join('');
 m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;closeMenu();goRoom(b.dataset.room);});
 $('#locBtn').addEventListener('click',e=>{e.stopPropagation();m.hidden=!m.hidden;});
 document.addEventListener('click',closeMenu);}
function closeMenu(){const m=$('#locMenu');if(m)m.hidden=true;}
function updateHUD(){const R=ROOMS[G.roomKey];$('#locBtn').textContent=R.name+' ▾';
 document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.go===G.roomKey));G.tipIdx=0;G.tipT=0;updateNotice();}
function updateNotice(){const R=ROOMS[G.roomKey];if(!R)return;const n1=$('#notice .n1'),n2=$('#notice .n2');
 if(G.winOpen){n1.textContent=R.name+' · Reading';n2.textContent='Close the window to walk again.';}
 else if(G.near){n1.textContent=R.name+' · Board';n2.innerHTML=(TOUCH?'Tap':'Press')+' <b>E</b> to read “'+esc(G.near.label)+'”';}
 else{const tips=R.tips||TIPS;n1.textContent=R.name+' · Tip';n2.textContent=tips[G.tipIdx%tips.length];}
 $('#eBtn').classList.toggle('ready',!!G.near&&!G.winOpen);}

/* ---- windows ---- */
function openWindow(key){const sec=S[key];if(!sec)return;closeWindow();closeMenu();
 const el=document.createElement('div');el.className='win';el.setAttribute('role','dialog');el.setAttribute('aria-label',sec.title);
 el.innerHTML=`<div class="tb"><span class="t">${esc(sec.title)}</span><button type="button" class="btn x" aria-label="Close">×</button></div><div class="tools"><button type="button" class="btn walk">Walk around</button></div><div class="body">${sec.html()}</div><div class="status">Ready • ${esc(sec.status||'')}</div>`;
 $('#winLayer').appendChild(el);G.winOpen=true;K.f=K.b=K.l=K.r=false;G.stick.x=G.stick.y=0;
 el.querySelector('.x').addEventListener('click',closeWindow);el.querySelector('.walk').addEventListener('click',closeWindow);
 makeDraggable(el,el.querySelector('.tb'));if(sec.wire)sec.wire(el);else el.querySelector('.walk').focus({preventScroll:true});updateNotice();}
function closeWindow(){const l=$('#winLayer');if(!l||!l.firstChild)return;l.innerHTML='';G.winOpen=false;if(G.roomKey)updateNotice();}
function makeDraggable(el,handle){let d=null;
 handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=el.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top,id:e.pointerId};
  el.style.transform='none';el.style.left=r.left+'px';el.style.top=r.top+'px';handle.setPointerCapture(e.pointerId);e.preventDefault();});
 handle.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;el.style.left=clamp(e.clientX-d.dx,-el.offsetWidth+80,innerWidth-80)+'px';el.style.top=clamp(e.clientY-d.dy,0,innerHeight-40)+'px';});
 const up=e=>{if(d&&e.pointerId===d.id)d=null;};handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);}
function interact(){if(G.transition||!G.near)return;const k=G.near.key;if(/^track\d+$/.test(k))jukePlay(+k.slice(5));openWindow(k);}

/* ---- input ---- */
function bindInput(){
 const KEYMAP={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
 window.addEventListener('keydown',e=>{if($('#game').hidden||paused)return;if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=KEYMAP[e.code];if(k){K[k]=true;e.preventDefault();return;}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')G.run=true;
  if(e.code==='KeyE'){if(G.winOpen)closeWindow();else interact();e.preventDefault();return;}
  if((e.code==='Enter'||e.code==='Space')&&!G.winOpen){interact();e.preventDefault();return;}
  if(e.code==='Escape'){if(G.winOpen)closeWindow();else closeMenu();}
  if(e.code==='KeyN'&&!e.repeat)setDay(DN.target<0.5,false);
  if(e.code==='KeyM'&&!e.repeat&&(G.roomKey==='music'||J.ready))jukeToggle();});
 window.addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)K[k]=false;if(e.code==='ShiftLeft'||e.code==='ShiftRight')G.run=false;});
 window.addEventListener('blur',()=>{K.f=K.b=K.l=K.r=false;G.run=false;});
 const canvas=$('#c');let drag=null;
 canvas.addEventListener('pointerdown',e=>{if(G.winOpen)return;drag={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);e.preventDefault();});
 canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  G.camYaw-=dx*0.006;G.camPitch=clamp(G.camPitch+dy*0.004,0.08,1.05);});
 const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null;};
 canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
 canvas.addEventListener('wheel',e=>{G.camDist=clamp(G.camDist+e.deltaY*0.004,3,9);e.preventDefault();},{passive:false});
 canvas.addEventListener('contextmenu',e=>e.preventDefault());
 const stick=$('#stick'),knob=$('#knob');let sid=null,sc=null;
 const moveStick=e=>{let dx=e.clientX-sc.x,dy=e.clientY-sc.y;const m=Math.hypot(dx,dy),max=44;if(m>max){dx*=max/m;dy*=max/m;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;const dz=v=>Math.abs(v)<0.15?0:v;G.stick.x=dz(dx/max);G.stick.y=dz(dy/max);};
 stick.addEventListener('pointerdown',e=>{sid=e.pointerId;const r=stick.getBoundingClientRect();sc={x:r.left+r.width/2,y:r.top+r.height/2};stick.setPointerCapture(sid);moveStick(e);e.preventDefault();});
 stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)moveStick(e);});
 const endStick=e=>{if(e.pointerId!==sid)return;sid=null;G.stick.x=G.stick.y=0;knob.style.transform='';};
 stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
 $('#eBtn').addEventListener('click',()=>{if(G.winOpen)closeWindow();else interact();});
 window.addEventListener('resize',resize);}

/* ---- frame ---- */
function resize(){if(!renderer)return;const w=innerWidth,h=innerHeight,s=Math.min(1,540/h);
 renderer.setSize(Math.max(1,Math.floor(w*s)),Math.max(1,Math.floor(h*s)),false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function updateCamera(k){const p=player,ang=p.heading+G.camYaw+Math.PI,cp=Math.cos(G.camPitch),sp=Math.sin(G.camPitch),B=G.bounds;
 // desired offset from the look-at point; shorten it along its own line so the camera never leaves the room
 const ox=Math.sin(ang)*G.camDist*cp,oz=Math.cos(ang)*G.camDist*cp,oy=1.0+G.camDist*sp-1.5;
 const lim=(o,lo,hi,c)=>o>1e-4?(hi-c)/o:o<-1e-4?(lo-c)/o:1;
 let t=Math.min(1,lim(ox,-B.w/2+0.4,B.w/2-0.4,p.x),lim(oz,-B.d/2+0.4,B.d/2-0.4,p.z),lim(oy,0.6-1.5,(B.indoor?B.H-0.35:60)-1.5,0));
 t=Math.max(0.42,t);
 let tx=p.x+ox*t,tz=p.z+oz*t,ty=1.5+oy*t;
 tx=clamp(tx,-B.w/2+0.35,B.w/2-0.35);tz=clamp(tz,-B.d/2+0.35,B.d/2-0.35);ty=clamp(ty,0.6,B.indoor?B.H-0.35:60);
 tmpV.set(tx,ty,tz);if(k>=1)camera.position.copy(tmpV);else camera.position.lerp(tmpV,k);
 camera.lookAt(p.x,1.5,p.z);}
function update(dt){const p=player;let fwd=0,turn=0;
 if(!G.winOpen&&!G.transition){if(K.f)fwd+=1;if(K.b)fwd-=1;if(K.l)turn+=1;if(K.r)turn-=1;fwd-=G.stick.y;turn-=G.stick.x;}
 fwd=clamp(fwd,-1,1);turn=clamp(turn,-1,1);
 if(turn)p.heading+=turn*2.4*dt;
 if(fwd!==0&&Math.abs(G.camYaw)>0.001){p.heading+=G.camYaw;G.camYaw=0;}
 const spd=(G.run?6.5:3.7)*fwd;
 if(spd){p.x+=Math.sin(p.heading)*spd*dt;p.z+=Math.cos(p.heading)*spd*dt;}
 const B=G.bounds;p.x=clamp(p.x,-B.w/2+0.5,B.w/2-0.5);p.z=clamp(p.z,-B.d/2+0.5,B.d/2-0.5);
 for(const c of G.colliders){
  if(c.r!==undefined){const dx=p.x-c.cx,dz=p.z-c.cz,dd=Math.hypot(dx,dz),min=c.r+PR;if(dd<min&&dd>1e-4){p.x=c.cx+dx/dd*min;p.z=c.cz+dz/dd*min;}}
  else{const x1=c.x1-PR,x2=c.x2+PR,z1=c.z1-PR,z2=c.z2+PR;if(p.x>x1&&p.x<x2&&p.z>z1&&p.z<z2){const l=p.x-x1,r=x2-p.x,t=p.z-z1,b=z2-p.z,m=Math.min(l,r,t,b);
   if(m===l)p.x=x1;else if(m===r)p.x=x2;else if(m===t)p.z=z1;else p.z=z2;}}}
 const moving=Math.abs(spd)>0.01;if(moving)p.anim+=dt*(G.run?15:10);p.amp+=((moving?1:0)-p.amp)*Math.min(1,dt*10);
 const s=Math.sin(p.anim)*p.amp;p.arms[0].rotation.x=s*0.7;p.arms[1].rotation.x=-s*0.7;p.legs[0].rotation.x=-s*0.6;p.legs[1].rotation.x=s*0.6;
 p.group.position.set(p.x,Math.abs(s)*0.07,p.z);p.group.rotation.y=p.heading;
 G.cooldown-=dt;
 if(G.cooldown<=0&&!G.transition){for(const dr of G.doors){const dx=p.x-dr.x,dz=p.z-dr.z;if(dx*dx+dz*dz<1.3*1.3){enterRoom(dr.to,dr,false);break;}}}
 let best=null,bd=1e9;for(const it of G.inter){const dx=p.x-it.x,dz=p.z-it.z,dd=dx*dx+dz*dz;if(dd<it.r*it.r&&dd<bd){bd=dd;best=it;}}
 if(best!==G.near){if(G.near)G.near.mat.emissive.setHex(0x000000);if(best)best.mat.emissive.setHex(0x4a4626);G.near=best;updateNotice();}
 for(const t of G.torches){const f=0.78+0.22*Math.sin(G.t*11+t.seed)*Math.sin(G.t*7.3+t.seed*2);t.light.intensity=f;t.flame.scale.y=0.8+0.5*f;}
 G.tipT+=dt;if(G.tipT>7){G.tipT=0;G.tipIdx++;if(!G.near&&!G.winOpen)updateNotice();}
 tickDN(dt);updateCamera(1-Math.exp(-dt*9));}
function loop(){requestAnimationFrame(loop);if(paused||$('#game').hidden){clock.getDelta();return;}const dt=Math.min(0.05,clock.getDelta());G.t+=dt;update(dt);renderer.render(scene,camera);}

function initGame(){const canvas=$('#c');renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(1);
 scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0b1c);camera=new THREE.PerspectiveCamera(62,1,0.1,300);world=new THREE.Group();scene.add(world);clock=new THREE.Clock();tmpV=_v();
 ANISO=Math.min(4,renderer.capabilities.getMaxAnisotropy()||1);
 makeCanvases();makeSky();player=makePlayer();scene.add(player.group);
 resize();bindInput();buildMenu();buildBar();bindJuke();setDay(dayPref(),true);
 enterRoom('lobby',null,true);
 requestAnimationFrame(loop);}

/* ---- mode switching ---- */
function setHash(h){try{history.replaceState(null,'',location.pathname+location.search+h);}catch(e){}}
async function showGame(){$('#plain').hidden=true;$('#game').hidden=false;setHash('#play');
 if(started){paused=false;resize();if(G.roomKey==='music')jukeEnter();return;}
 if(starting)return;starting=true;
 const lw=$('#loadWin');lw.hidden=false;$('#loadBtns').hidden=true;$('#loadMsg').textContent='Fetching the 3D engine and building the courtyard.';$('#loadStatus').textContent='Please wait';
 try{await loadThree();await fontReady();initGame();started=true;paused=false;lw.hidden=true;}
 catch(err){console.error(err);$('#loadMsg').textContent='The 3D engine could not be loaded. Check the connection and try again, or read the plain site.';$('#loadBtns').hidden=false;$('#loadStatus').textContent='Error';}
 starting=false;}
function showPlain(){paused=true;closeWindow();if(started)jukeLeave();$('#game').hidden=true;$('#plain').hidden=false;setHash('#plain');window.scrollTo(0,0);}

function boot(){buildPlain();const h=location.hash;const plainWanted=h==='#plain'||h.indexOf('#p-')===0||(h!=='#play'&&isMobile());
 $('#toPlain').addEventListener('click',showPlain);
 $('#plain').addEventListener('click',e=>{if(e.target.closest('.play'))showGame();});
 $('#loadRetry').addEventListener('click',showGame);$('#loadPlain').addEventListener('click',showPlain);
 if(plainWanted){showPlain();if(h.indexOf('#p-')===0){const t=document.querySelector(h);if(t)t.scrollIntoView();}}else showGame();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
// small console hook: RIFFF.go('music'), RIFFF.open('skills'), RIFFF.plain(), RIFFF.play()
window.RIFFF={go:goRoom,open:openWindow,plain:showPlain,play:showGame,day:v=>setDay(v!==false,false),music:{play:jukePlay,pause:()=>jukePause(true),get state(){return{idx:J.idx,playing:J.playing,ready:J.ready,failed:J.failed};}},get state(){return{room:G.roomKey,player:player&&{x:player.x,z:player.z,heading:player.heading},near:G.near&&G.near.key,cam:camera&&camera.position.toArray().map(v=>+v.toFixed(2))};},teleport(x,z){if(player){player.x=x;player.z=z;}}};
})();
</script>
